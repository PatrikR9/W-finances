<style>
/* Manhattan Rockets: žlutá raketa, černé serifové písmo, bílý papír */
:root{
  --yellow:#F8CA1F;--yellow-soft:#FFF4CC;--ink:#111111;--paper:#FAFAFA;--surface:#FFFFFF;--surface-2:#F2F2F2;--muted:#5E5E5E;--line:#E3E3E3;
  --c-structures:#3567A6;--c-avionika:#1F8A5B;--c-software:#8A4FBF;
  --ok:#1F7A45;--ok-soft:#E1F3E8;--warn:#B85D0E;--warn-soft:#FDEBD9;--bad:#B3261E;--bad-soft:#FBE3E1;
  --f-brand:"Merriweather",Georgia,"Times New Roman",serif;--f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --yellow-soft:#3A3008;--ink:#F2F2F2;--paper:#0F0F0F;--surface:#181818;--surface-2:#242424;--muted:#A8A8A8;--line:#2E2E2E;
  --c-structures:#7EA7E0;--c-avionika:#5CC79A;--c-software:#C19BEB;
  --ok:#6BD39A;--ok-soft:#14301F;--warn:#F2A35C;--warn-soft:#3A2410;--bad:#F28B82;--bad-soft:#3A1614;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 56px}
.wrap{max-width:780px;margin:0 auto}
h1,h2,h3{font-family:var(--f-brand);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.3rem}h3{font-size:1.05rem}
.muted{color:var(--muted)}.small{font-size:.88rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92em}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:3px}
header.top{display:flex;align-items:center;gap:14px;padding-block:20px 16px;border-bottom:4px solid var(--yellow)}
header.top img{width:52px;height:52px;flex:none}
header.top .brand{display:flex;flex-direction:column;line-height:1.15}
header.top .brand b{font-family:var(--f-brand);font-size:1.25rem;letter-spacing:.04em}
header.top .brand span{color:var(--muted);font-size:.9rem;font-weight:600;letter-spacing:.02em}
nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;margin:18px 0;background:var(--surface-2);border-radius:12px}
nav button{background:none;border:0;color:var(--ink);font:600 1rem var(--f-body);padding:10px 14px;border-radius:8px;cursor:pointer}
nav button[aria-current="page"]{background:var(--yellow);color:#111;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--surface-2);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:currentColor}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:600}
input,select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--yellow-soft)}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 1rem var(--f-body);padding:12px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#111}
.btn.primary:hover{filter:brightness(.96)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 160px}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600}
.result{border-radius:12px;padding:16px;border:1.5px solid;display:flex;flex-direction:column;gap:8px}
.result.ok{background:var(--ok-soft);border-color:var(--ok)}.result.bad{background:var(--bad-soft);border-color:var(--bad)}.result.wait{background:var(--yellow-soft);border-color:var(--yellow)}
.result ul{margin:0;padding-left:18px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{text-align:left;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1.5px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tfoot td{border-bottom:0}
.r{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:6px}
.bar i{height:100%;background:currentColor}.bar i+i{opacity:.4}
.req{display:flex;flex-direction:column;gap:6px;padding-block:14px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.req .h b{flex:1 1 200px}
.req a{overflow-wrap:anywhere;font-size:.85rem}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.err{color:var(--bad);font-size:.92rem;font-weight:600;min-height:1.2em}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:600 .88rem var(--f-body);padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--yellow);color:#111;border-color:var(--yellow)}
.grp{border-top:4px solid currentColor}
.ms{background:var(--ink);color:var(--paper);border:0}
.ms .eyebrow{color:var(--yellow)}
.ms p{color:inherit;opacity:.8}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum .card{background:var(--surface);border:1px solid var(--line);border-top:4px solid currentColor;border-radius:12px;padding:12px;min-width:0}
.sum .card b{display:block;font-family:var(--f-brand);font-size:.95rem;margin-bottom:2px}
.sum .card .v{color:var(--ink);font-family:var(--f-mono);font-size:1.05rem;font-weight:700}
.sum .card .l{color:var(--muted);font-size:.78rem}
@media (max-width:520px){.sum{gap:6px}.sum .card{padding:10px 8px}.sum .card .v{font-size:.9rem}.sum .card b{font-size:.82rem}}@media (max-width:340px){.sum{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

  <nav id="nav"><button data-tab="zadost" aria-current="page">Poslat žádost</button><button data-tab="prehled">Přehled</button></nav>
  <main id="view"><div class="empty">Načítám…</div></main>
</div>
<script>
const CATS={structures:"Structures",avionika:"Avionika",software:"Software"};
const STATUS={ok:["Schváleno – proplať u CRS","ok"],approved:["Schváleno Patrikem","ok"],paid:["Proplaceno","ok"],asked:["Čeká na Patrika","warn"],denied:["Zamítnuto – obrať se na Patrika","bad"],rejected:["Zamítnuto Patrikem","bad"]};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
const store={get(k){try{return localStorage.getItem(k)||""}catch{return""}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const S={tab:"zadost",result:null,busy:false,ms:null,budget:[],reqs:[],filter:"all",loadErr:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kc=n=>new Intl.NumberFormat("cs-CZ",{maximumFractionDigits:0}).format(Math.round(+n||0))+" Kč";
const d=t=>t?new Date(t).toLocaleDateString("cs-CZ"):"";
const chip=c=>`<span class="chip" style="color:var(--c-${c})"><i></i><span style="color:var(--ink)">${esc(CATS[c]||c)}</span></span>`;

async function loadData(){
  const ms=await sb.rpc("active_milestone");
  if(ms.error){S.loadErr=ms.error.message;return}
  S.loadErr=null;S.ms=ms.data?.[0]||null;
  S.budget=S.ms?((await sb.rpc("budget_usage",{p_milestone:S.ms.id})).data||[]):[];
  S.reqs=(await sb.from("requests").select("id,created_at,requester_name,category,url,description,product_name,qty,total,paid_amount,price_source,status,ai_reasons,admin_note,plea,items(name),milestones(name)").order("created_at",{ascending:false}).limit(200)).data||[];
}
let rq=null;function refresh(){clearTimeout(rq);rq=setTimeout(async()=>{await loadData();render()},400)}
sb.channel("req").on("postgres_changes",{event:"*",schema:"public",table:"requests"},refresh).on("postgres_changes",{event:"*",schema:"public",table:"items"},refresh).subscribe();

function render(){
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(S.loadErr){$("#view").innerHTML=`<div class="empty">Nepodařilo se načíst data (${esc(S.loadErr)}). Zkontroluj nastavení stránky.</div>`;return}
  const keep={};document.querySelectorAll("#view input,#view textarea,#view select").forEach(e=>{if(e.id)keep[e.id]=e.value});
  $("#view").innerHTML=S.tab==="prehled"?viewOverview():viewRequest();
  for(const[k,v]of Object.entries(keep)){const e=document.getElementById(k);if(e&&v!=="")e.value=v}
}
function viewRequest(){
  if(!S.ms)return`<div class="empty">Teď není aktivní žádný milestone, takže nejde nic čerpat. Obrať se na Patrika.</div>`;
  const g=store.get("grp"),n=store.get("name");
  const r=S.result;let res="";
  if(S.busy)res=`<div class="result wait"><b>Kontroluju produkt…</b><span class="small">Stahuju stránku a porovnávám s rozpočtem. Obvykle do 20 s.</span></div>`;
  else if(r){const q=r.request;const ok=q.status==="ok";res=`<div class="result ${ok?"ok":q.status==="asked"?"wait":"bad"}"><h3>${ok?"Sedí s rozpočtem – můžeš proplatit u CRS":q.status==="asked"?"Odesláno Patrikovi":"Nesedí s rozpočtem"}</h3>
    <div><b>${esc(q.product_name)}</b> · ${q.qty} ks · <span class="num">${kc(q.total)}</span>${q.price_source==="estimate"?" (odhad)":""}</div>
    ${r.item_name?`<div class="small">Položka rozpočtu: <b>${esc(r.item_name)}</b></div>`:""}
    <ul>${(q.ai_reasons||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    ${ok?`<span class="small">Žádost je uložená a částka rezervovaná.</span>`:q.status==="asked"?`<span class="small">Patrik se ti ozve.</span>`:`<span class="small">S prosbou o výjimku se obrať na Patrika – můžeš mu to poslat rovnou odsud.</span><label>Proč to potřebuješ<textarea id="plea"></textarea></label><div><button class="btn primary" data-act="ask" data-id="${q.id}">Poslat Patrikovi</button></div>`}</div>`}
  return`<div class="stack"><form class="panel" id="reqform"><div><div class="eyebrow">${esc(S.ms.name)}</div><h2>Žádost o proplacení</h2></div>
  <div class="row"><label>Skupina<select id="r-grp" required><option value="">Vyber…</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===g?"selected":""}>${v}</option>`).join("")}</select></label>
  <label>Tvoje jméno<input id="r-name" value="${esc(n)}" autocomplete="name" required></label></div>
  <label>Odkaz na produkt<input id="r-url" type="url" inputmode="url" placeholder="https://…" required autocomplete="off"></label>
  <label>Popis (nepovinné)<textarea id="r-desc" placeholder="např. 2 ks, na letový počítač"></textarea></label>
  <details><summary>Počet kusů</summary><label style="margin-top:8px">Kusů<input id="r-qty" type="number" min="1" step="1" placeholder="AI určí sama"></label></details>
  <div class="err" id="r-err"></div>
  <button class="btn primary" type="submit" ${S.busy?"disabled":""}>Zkontrolovat a odeslat</button></form>${res}</div>`;
}
function budgetTable(cat){
  const items=S.budget.filter(i=>i.category===cat);
  if(!items.length)return`<div class="empty small">Skupina v tomto milestonu nic nečerpá.</div>`;
  const sum=items.reduce((a,i)=>({plan:a.plan+ +i.plan,rem:a.rem+ +i.remaining}),{plan:0,rem:0});
  return`<div class="tbl"><table><thead><tr><th>Položka</th><th class="r">Plán</th><th class="r">Zbývá</th></tr></thead><tbody>${items.map(i=>{const max=Math.max(+i.plan,+i.spent+ +i.reserved,1);return`<tr><td>${esc(i.name)}${i.description?`<div class="small muted">${esc(i.description)}</div>`:""}<div class="bar" style="color:var(--c-${i.category})"><i style="width:${i.spent/max*100}%"></i><i style="width:${i.reserved/max*100}%"></i></div></td><td class="r num">${+i.plan?kc(i.plan):"—"}</td><td class="r num" style="color:${+i.remaining<0?"var(--bad)":"inherit"}">${i.item_id?kc(i.remaining):""}</td></tr>`}).join("")}</tbody><tfoot><tr><td><b>Celkem</b></td><td class="r num"><b>${kc(sum.plan)}</b></td><td class="r num"><b>${kc(sum.rem)}</b></td></tr></tfoot></table></div>`;
}
function viewOverview(){
  const ms=S.ms;
  const list=S.reqs.filter(r=>S.filter==="all"||r.category===S.filter);
  const reqs=list.length?list.map(r=>{const [l,t]=STATUS[r.status];return`<div class="req"><div class="h"><b>${esc(r.product_name)}</b><span class="num">${kc(r.status==="paid"?(r.paid_amount??r.total):r.total)}</span><span class="pill ${t}">${l}</span></div>
    <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\//,"").slice(0,70))}</a>
    <span class="small muted">${esc(r.requester_name||"—")} · ${chip(r.category)} · ${d(r.created_at)}${r.items?.name?` · ${esc(r.items.name)}`:""}</span>
    ${r.admin_note?`<span class="small"><b>Patrik:</b> ${esc(r.admin_note)}</span>`:""}
    ${r.status==="denied"?`<div><button class="btn sm" data-act="askfrom" data-id="${r.id}">Poslat Patrikovi</button></div>`:""}</div>`}).join(""):`<div class="empty">Žádné žádosti.</div>`;
  return`<div class="stack">
  ${ms?`<div class="panel ms"><div><div class="eyebrow">Aktivní milestone${ms.deadline?` · do ${d(ms.deadline)}`:""}</div><h2>${esc(ms.name)}</h2></div>${ms.goal?`<p style="margin:0">${esc(ms.goal)}</p>`:""}</div>
  <div class="sum">${Object.keys(CATS).map(c=>{const it=S.budget.filter(i=>i.category===c);const p=it.reduce((a,i)=>a+ +i.plan,0),sp=it.reduce((a,i)=>a+ +i.spent,0),rs=it.reduce((a,i)=>a+ +i.reserved,0),max=Math.max(p,sp+rs,1);return`<div class="card" style="color:var(--c-${c})"><b>${CATS[c]}</b><div class="v">${kc(p-sp-rs)}</div><div class="l">zbývá z ${kc(p)}</div><div class="bar"><i style="width:${sp/max*100}%"></i><i style="width:${rs/max*100}%"></i></div></div>`}).join("")}</div>
  <span class="small muted">Plný pruh = proplaceno, světlý = schváleno, čeká na proplacení.</span>
  <section class="panel"><h3>Žádosti</h3><div class="filters">${[["all","Všechny"],...Object.entries(CATS)].map(([k,v])=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${v}</button>`).join("")}</div><div>${reqs}</div></section>
  <h3 style="margin-top:6px">Rozpočet podle položek</h3>
  ${Object.keys(CATS).map(c=>`<section class="panel grp" style="color:var(--c-${c})"><h3>${CATS[c]}</h3><div style="color:var(--ink)">${budgetTable(c)}</div></section>`).join("")}
`:`<div class="empty">Žádný aktivní milestone.</div>`}
</div>`;
}

async function fnError(error){try{const j=await error.context.json();return j.error||error.message}catch{return error.message}}
document.addEventListener("submit",async e=>{
  e.preventDefault();if(e.target.id!=="reqform")return;
  const category=$("#r-grp").value,name=$("#r-name").value.trim(),url=$("#r-url").value.trim(),description=$("#r-desc").value.trim(),qty=+$("#r-qty").value||undefined;
  if(!category){$("#r-err").textContent="Vyber skupinu.";return}
  store.set("grp",category);store.set("name",name);
  S.busy=true;S.result=null;render();
  const {data,error}=await sb.functions.invoke("check-request",{body:{category,name,url,description,qty}});
  S.busy=false;
  if(error){render();$("#r-err").textContent=await fnError(error);return}
  S.result=data;$("#r-url").value="";$("#r-desc").value="";$("#r-qty").value="";await loadData();render();
  for(const id of["r-url","r-desc","r-qty"]){const el=document.getElementById(id);if(el)el.value=""}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act],[data-tab],[data-filter]");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;if(S.tab==="prehled")await loadData();render();return}
  if(b.dataset.filter){S.filter=b.dataset.filter;render();return}
  const id=b.dataset.id;
  if(b.dataset.act==="askfrom"){const r=S.reqs.find(x=>x.id===id);S.tab="zadost";S.result={request:r,item_name:r.items?.name};render();window.scrollTo(0,0)}
  if(b.dataset.act==="ask"){b.disabled=true;const plea=$("#plea")?.value.trim()||"";const {data,error}=await sb.functions.invoke("check-request",{body:{action:"ask",id,plea}});
    if(error){b.disabled=false;alert(await fnError(error));return}S.result={...S.result,request:data.request};await loadData();render()}
});
